[package]
name = "portfolio-backend-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-full"] } 
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"]  }
tracing-appender = "0.2.5"
